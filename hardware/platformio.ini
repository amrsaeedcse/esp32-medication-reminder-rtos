; PlatformIO Project Configuration File
; Smart Medication Reminder (ESP32 + FreeRTOS + Deep Sleep + BLE)
;
; The firmware targets Arduino-ESP32 core 3.x (the API shipped with
; platform-espressif32 8.x). Pin the platform so a future release cannot
; silently change the LEDC/GPTimer APIs again.

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
; Bluedroid + Arduino needs more than the default 1.25 MB app partition.
board_build.partitions = huge_app.csv
